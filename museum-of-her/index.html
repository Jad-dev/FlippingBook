<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0908"><title>The Museum of You</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0908}iframe{display:block;width:100%;height:100%;border:0}.next{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;border:1px solid #c8a86b;background:rgba(11,9,8,.88);backdrop-filter:blur(10px);color:#f3eadb;border-radius:999px;padding:13px 18px;font:600 .72rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;white-space:nowrap}.next.show{display:block}.next:active{transform:translateX(-50%) scale(.97)}@media(min-width:821px){.next{display:none!important}}</style></head><body><iframe id="site" src="legacy.html" title="The Museum of You"></iframe><button id="next" class="next">Next exhibit ↓</button><script>const frame=document.getElementById('site'),next=document.getElementById('next');frame.addEventListener('load',async()=>{const w=frame.contentWindow,d=w.document;try{const [smile,masterpiece]=await Promise.all([fetch('smile-data.txt').then(r=>r.text()),fetch('masterpiece-data.txt').then(r=>r.text())]);const p2=d.getElementById('p2'),p4=d.getElementById('p4');if(p2)p2.src='data:image/jpeg;base64,'+smile.trim();if(p4)p4.src='data:image/jpeg;base64,'+masterpiece.trim()}catch(e){}const enter=d.getElementById('enter');if(enter)enter.addEventListener('click',()=>setTimeout(()=>next.classList.add('show'),250));const sections=()=>[...d.querySelectorAll('.room,.final')];function update(){const ys=w.scrollY,hs=w.innerHeight;const list=sections();const last=list[list.length-1];if(!last||ys+hs>last.offsetTop+120)next.classList.remove('show');else if(d.getElementById('museum')?.classList.contains('open'))next.classList.add('show')}w.addEventListener('scroll',update,{passive:true});next.onclick=()=>{const list=sections();const y=w.scrollY+20;const target=list.find(s=>s.offsetTop>y+80)||list[list.length-1];if(target)target.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(update,700)}});</script></body></html>
