<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0908"><title>The Museum of You</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0908}iframe{display:block;width:100%;height:100%;border:0}.next{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;border:1px solid #c8a86b;background:rgba(11,9,8,.88);backdrop-filter:blur(10px);color:#f3eadb;border-radius:999px;padding:13px 18px;font:600 .72rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;white-space:nowrap}.next.show{display:block}.next:active{transform:translateX(-50%) scale(.97)}@media(min-width:821px){.next{display:none!important}}</style></head><body><iframe id="site" src="legacy.html?v=4" title="The Museum of You"></iframe><button id="next" class="next">Next exhibit ↓</button><script>
const frame=document.getElementById('site');
const next=document.getElementById('next');

frame.addEventListener('load',async()=>{
  const w=frame.contentWindow;
  const d=w.document;

  try{
    const [smile,masterpiece]=await Promise.all([
      fetch('smile-data.txt?v=2').then(r=>r.text()),
      fetch('masterpiece-data.txt?v=2').then(r=>r.text())
    ]);
    const p2=d.getElementById('p2');
    const p4=d.getElementById('p4');
    if(p2) p2.src='data:image/jpeg;base64,'+smile.trim();
    if(p4) p4.src='data:image/jpeg;base64,'+masterpiece.trim();
  }catch(e){ console.warn('Photo enhancement failed',e); }

  const enter=d.getElementById('enter');
  const hero=d.getElementById('hero');
  const museum=d.getElementById('museum');

  // Mobile-safe, self-contained museum entry handler.
  if(enter){
    enter.addEventListener('click',(event)=>{
      event.preventDefault();
      event.stopPropagation();
      if(hero) hero.style.display='none';
      if(museum) museum.classList.add('open');
      try{ w.scrollTo({top:0,left:0,behavior:'auto'}); }catch(_){ w.scrollTo(0,0); }
      d.querySelectorAll('.reveal').forEach((el,i)=>{
        if(i<2) el.classList.add('show');
      });
      setTimeout(()=>next.classList.add('show'),180);
    },true);
  }

  const sections=()=>[...d.querySelectorAll('.room,.final')];
  function update(){
    const list=sections();
    if(!list.length) return next.classList.remove('show');
    const last=list[list.length-1];
    const atFinal=w.scrollY+w.innerHeight>last.offsetTop+120;
    if(atFinal) next.classList.remove('show');
    else if(museum && museum.classList.contains('open')) next.classList.add('show');
  }

  w.addEventListener('scroll',update,{passive:true});

  next.onclick=()=>{
    const list=sections();
    const y=w.scrollY+20;
    const target=list.find(s=>s.offsetTop>y+80)||list[list.length-1];
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(update,750);
  };
});
</script></body></html>
